<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0a1a"/>
      <stop offset="100%" stop-color="#101729"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18132c"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gradEmeraldCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gradPinkOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gradVioletCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gradAmberPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Outer Container -->
  <rect x="2" y="2" width="956" height="466" rx="20" fill="url(#panelBg)" stroke="url(#frameBorder)" stroke-width="2"/>

  <!-- Section Header -->
  <text x="32" y="42" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">PROJECT PROGRESS TELEMETRY</text>
  <text x="928" y="42" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">STATUS: COMPILING ALMOST EVERYTHING // LINK &amp; BOOT NEXT</text>

  <!-- Overall Progress Box -->
  <rect x="28" y="60" width="904" height="78" rx="14" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text x="48" y="88" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Overall Reconstruction &amp; Port Readiness</text>
  <text x="912" y="88" text-anchor="end" fill="#f472b6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="800">78%</text>
  <rect x="48" y="102" width="864" height="16" rx="8" fill="#090d16"/>
  <rect x="48" y="102" width="674" height="16" rx="8" fill="url(#gradPinkOrange)"/>

  <!-- Row 1 Left: Function Lifting -->
  <rect x="28" y="154" width="442" height="90" rx="14" fill="url(#cardBg)" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1"/>
  <text x="48" y="182" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Native Function Lifting (libGangstar4 + generator)</text>
  <text x="450" y="182" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="800">100%</text>
  <rect x="48" y="196" width="402" height="12" rx="6" fill="#090d16"/>
  <rect x="48" y="196" width="402" height="12" rx="6" fill="url(#gradEmeraldCyan)"/>
  <text x="48" y="229" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">60,541 + 2,472 functions lifted // 6,654 vtables mapped</text>

  <!-- Row 1 Right: DEX / Java -->
  <rect x="490" y="154" width="442" height="90" rx="14" fill="url(#cardBg)" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1"/>
  <text x="510" y="182" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Dalvik / Java Decompilation (classes.dex)</text>
  <text x="912" y="182" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="800">100%</text>
  <rect x="510" y="196" width="402" height="12" rx="6" fill="#090d16"/>
  <rect x="510" y="196" width="402" height="12" rx="6" fill="url(#gradEmeraldCyan)"/>
  <text x="510" y="229" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">4,634 classes // 26,453 methods across 149 packages</text>

  <!-- Row 2 Left: CMake / Ninja Build -->
  <rect x="28" y="260" width="442" height="90" rx="14" fill="url(#cardBg)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
  <text x="48" y="288" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Android ARM32 C++ Compilation (Ninja)</text>
  <text x="450" y="288" text-anchor="end" fill="#e879f9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="800">99.1%</text>
  <rect x="48" y="302" width="402" height="12" rx="6" fill="#090d16"/>
  <rect x="48" y="302" width="398" height="12" rx="6" fill="url(#gradVioletCyan)"/>
  <text x="48" y="335" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">~1,548 / 1,561 TUs pass // 13 TUs failing (78 errors left)</text>

  <!-- Row 2 Right: Engine Stubs & Call-Site Fixes -->
  <rect x="490" y="260" width="442" height="90" rx="14" fill="url(#cardBg)" stroke="#ff6b35" stroke-opacity="0.3" stroke-width="1"/>
  <text x="510" y="288" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Engine Method Recovery &amp; Stub Wiring</text>
  <text x="912" y="288" text-anchor="end" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="800">82%</text>
  <rect x="510" y="302" width="402" height="12" rx="6" fill="#090d16"/>
  <rect x="510" y="302" width="330" height="12" rx="6" fill="url(#gradPinkOrange)"/>
  <text x="510" y="335" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">VFS/glf/vox/gameswf/iap/chatv2 done // glitch &amp; havok next</text>

  <!-- Row 3 Left: Runtime Boot & Rendering -->
  <rect x="28" y="366" width="442" height="84" rx="14" fill="url(#cardBg)" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1"/>
  <text x="48" y="393" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Live Runtime Boot &amp; GLES2 Rendering</text>
  <text x="450" y="393" text-anchor="end" fill="#fb923c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="800">25%</text>
  <rect x="48" y="406" width="402" height="12" rx="6" fill="#090d16"/>
  <rect x="48" y="406" width="101" height="12" rx="6" fill="url(#gradAmberPink)"/>
  <text x="48" y="436" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">16 KB ELF align + reloc init ready // awaiting final link</text>

  <!-- Row 3 Right: Clean C++14 Refactor -->
  <rect x="490" y="366" width="442" height="84" rx="14" fill="url(#cardBg)" stroke="#ec4899" stroke-opacity="0.25" stroke-width="1"/>
  <text x="510" y="393" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Readable 64-Bit-Safe C++14 Refactoring</text>
  <text x="912" y="393" text-anchor="end" fill="#f472b6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="800">10%</text>
  <rect x="510" y="406" width="402" height="12" rx="6" fill="#090d16"/>
  <rect x="510" y="406" width="40" height="12" rx="6" fill="url(#gradAmberPink)"/>
  <text x="510" y="436" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">Archive/VFS &amp; HDIDFV cleaned // raw Hex-Rays C++ elsewhere</text>
</svg>
